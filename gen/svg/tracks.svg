<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="656" height="376" viewBox="0 0 656 376">


  <!-- outside white -->
  <rect width="656" height="376" fill="#ffffff"/>
  <!-- soft outer shadow of card -->
  <rect x="10" y="12" width="636" height="356" rx="48" ry="48" fill="#00000018"/>
  <!-- border -->
  <rect x="8" y="8" width="640" height="360" rx="48" ry="48" fill="#8B7355"/>
  <!-- inner pastel -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F0E6D8"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.04 0"/>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>
  <rect x="22" y="22" width="612" height="332"
        rx="38" ry="38" fill="url(#bgGrad)"/>
  <rect x="22" y="22" width="612" height="332"
        rx="38" ry="38" fill="#ffffff" opacity="0.08"/>

  <g filter="url(#softShadow)">
    <defs>
      <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C0C0C8"/>
        <stop offset="100%" stop-color="#5A5A68"/>
      </linearGradient>
      <linearGradient id="tie" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#D4B896"/>
        <stop offset="100%" stop-color="#8B6914"/>
      </linearGradient>
    </defs>
    <ellipse cx="328" cy="290" rx="230" ry="28" fill="#00000012"/>
    <rect x="110" y="130" width="436" height="22" rx="5" fill="url(#tie)" stroke="#6B4F2A" stroke-width="2"/>
    <rect x="110" y="166" width="436" height="22" rx="5" fill="url(#tie)" stroke="#6B4F2A" stroke-width="2"/>
    <rect x="110" y="202" width="436" height="22" rx="5" fill="url(#tie)" stroke="#6B4F2A" stroke-width="2"/>
    <rect x="110" y="238" width="436" height="22" rx="5" fill="url(#tie)" stroke="#6B4F2A" stroke-width="2"/>
    <rect x="110" y="274" width="436" height="22" rx="5" fill="url(#tie)" stroke="#6B4F2A" stroke-width="2"/>

    <rect x="175" y="115" width="22" height="185" rx="6" fill="url(#rail)" stroke="#3D3D45" stroke-width="2.5"/>
    <rect x="459" y="115" width="22" height="185" rx="6" fill="url(#rail)" stroke="#3D3D45" stroke-width="2.5"/>
    <!-- rail highlights -->
    <rect x="179" y="120" width="6" height="170" rx="2" fill="#ffffff" opacity="0.35"/>
    <rect x="463" y="120" width="6" height="170" rx="2" fill="#ffffff" opacity="0.35"/>
    <!-- perspective: make it look more like tracks going away - add slight taper via additional shape -->
    <!-- friendly spike bolts -->
    <circle cx="186" cy="140" r="4" fill="#F4D35E" stroke="#C9A227" stroke-width="1.5"/>
    <circle cx="470" cy="140" r="4" fill="#F4D35E" stroke="#C9A227" stroke-width="1.5"/>
    <circle cx="186" cy="176" r="4" fill="#F4D35E" stroke="#C9A227" stroke-width="1.5"/>
    <circle cx="470" cy="176" r="4" fill="#F4D35E" stroke="#C9A227" stroke-width="1.5"/>
    <circle cx="186" cy="212" r="4" fill="#F4D35E" stroke="#C9A227" stroke-width="1.5"/>
    <circle cx="470" cy="212" r="4" fill="#F4D35E" stroke="#C9A227" stroke-width="1.5"/>
    <circle cx="186" cy="248" r="4" fill="#F4D35E" stroke="#C9A227" stroke-width="1.5"/>
    <circle cx="470" cy="248" r="4" fill="#F4D35E" stroke="#C9A227" stroke-width="1.5"/>
  </g>

</svg>
